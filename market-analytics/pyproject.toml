[project]
name = "market-analytics"
version = "0.1.0"
description = "Analytics skeleton for sanitized marketplace parser export bundle imports."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
test = []

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
